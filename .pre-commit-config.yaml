repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-check
        alias: ruff-complexity
        name: Check code complexity
        args: [--select, "C901,PLR0912,PLR0915", --no-fix]
        files: ^(src|scripts)/.*\.py$
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: \.ipynb$

  - repo: local
    hooks:
      - id: pytest
        name: Run test suite
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
